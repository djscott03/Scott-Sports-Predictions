# Player-prop scan on GitHub's runner. MANUAL ONLY -- never add a schedule: every run
# bills (games x markets) credits from the free 500/month Odds API tier (needs the
# ODDS_API_KEY repo secret). The board lands in the run's job summary and the CSVs
# as a downloadable artifact; nothing is committed.
name: props scan

on:
  workflow_dispatch:
    inputs:
      season:
        description: "season, e.g. 2026"
        required: true
      week:
        description: "week number"
        required: true
      markets:
        description: "comma-separated Odds API prop markets"
        default: "player_pass_yds,player_rush_yds,player_reception_yds,player_receptions"
      hours:
        description: "only games kicking off within this many hours"
        default: "72"
      credits:
        description: "refuse the scan if the estimate (games x markets) exceeds this"
        default: "40"
      weight:
        description: "projection blend weight; 0 = devigged market consensus only (stale lines + middles), 0.30 = the CLI default"
        default: "0"
      exclude:
        description: "books that may not be a +EV row or a middle leg: 'nonus' = EU/UK/AU/exchange keys + pinnacle, or a comma list"
        default: "nonus"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # inputs are free text: pass them through env vars, quoted, never interpolated into the shell
      - name: scan props
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SEASON: ${{ inputs.season }}
          WEEK: ${{ inputs.week }}
          MARKETS: ${{ inputs.markets }}
          HOURS: ${{ inputs.hours }}
          CREDITS: ${{ inputs.credits }}
          WEIGHT: ${{ inputs.weight }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          python run.py nfl props "$SEASON" "$WEEK" \
            --markets "$MARKETS" --hours "$HOURS" --credits "$CREDITS" --weight "$WEIGHT" --exclude "$EXCLUDE"
      - name: job summary
        env:
          SEASON: ${{ inputs.season }}
          WEEK: ${{ inputs.week }}
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os
          import pandas as pd
          season, week = os.environ["SEASON"].strip(), os.environ["WEEK"].strip()
          def load(path):
              try: return pd.read_csv(path)
              except (FileNotFoundError, pd.errors.EmptyDataError): return pd.DataFrame()
          def table(d, cols, n=25):
              d = d[[c for c in cols if c in d]].head(n).round(3).fillna("")
              print("| " + " | ".join(d.columns) + " |"); print("|" + "---|" * len(d.columns))
              for r in d.itertuples(index=False): print("| " + " | ".join(str(v) for v in r) + " |")
          d = load(f"props_nfl_{season}_w{week}.csv")
          print(f"## props scan {season} w{week} — top {min(len(d), 25)} of {len(d)} by EV\n")
          if len(d):
              table(d, ["matchup", "market", "player", "side", "line", "price", "book", "n_books", "market_mu",
                        "proj_mean", "fair_mu", "fair_price", "ev_pct", "kelly_stake", "flags"])
          else:
              print("no props above the +3% EV threshold")
          m = load(f"props_middles_nfl_{season}_w{week}.csv")
          print(f"\n## prop arbs & middles — top {min(len(m), 25)} of {len(m)} (% of the total stake)\n")
          if len(m):
              table(m, ["type", "matchup", "market", "player", "bet_a", "bet_b", "window", "p_middle",
                        "miss_cost_pct", "win_both_pct", "ev_pct", "guaranteed_pct", "breakeven_p", "alt"])
          else:
              print("no cross-book prop arbs or +EV middles")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: props-nfl-${{ inputs.season }}-w${{ inputs.week }}
          path: |
            props_*.csv
            !props_template.csv
