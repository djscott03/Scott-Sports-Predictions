# Publishes the NFL card for the current week into predictions/nfl/ and grades
# previous weeks. Runs Tuesday (lines open, last week's results final) and
# Thursday morning ET (lines settled before TNF). Trigger manually from the
# Actions tab any time with "Run workflow".
name: weekly card

on:
  schedule:
    - cron: "0 13 * * 2,4"   # 13:00 UTC = 9am ET, Tue & Thu
  workflow_dispatch:
    inputs:
      league:
        description: "nfl or cfb (cfb needs CFBD_API_KEY secret)"
        default: "nfl"
      season:
        description: "season (blank = auto)"
        default: ""
      week:
        description: "week (blank = auto)"
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: price the week
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python publish_card.py ${{ github.event.inputs.league || 'nfl' }} \
            ${{ github.event.inputs.season }} ${{ github.event.inputs.week }}
      - name: commit predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions
          git diff --cached --quiet && echo "no changes" || \
            (git commit -m "predictions: $(date -u +'%Y-%m-%d %H:%M') UTC" && git push)
