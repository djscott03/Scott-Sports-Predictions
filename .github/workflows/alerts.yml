# Board + alerts: pull the game-line board once on a fixed schedule, PUBLISH it as the dashboard's snapshot (the
# `board` branch, never main -- so Streamlit Cloud does not redeploy and any number of viewers read it for 0
# credits), KEEP the pull in board/../history/<league>/<YYYY-MM-DD>.parquet on that same branch (line history:
# one small parquet per day, ~17 pulls x 2.5k rows each, a few hundred KB -- a year of it is fine), report the
# sharp books' moves since the previous snapshot (📈 STEAM), and push anything NEW -- arbs, free middles, +EV
# middles, the top +EV picks -- to Discord and/or Telegram (alerts.py). Dedupe lives in alerts_state.json,
# carried from run to run by actions/cache. The schedule below IS the monthly credit spend: viewers never
# trigger a pull.
#
# Credit math -- the free Odds API tier is 500 credits/month and the owner will not pay. The game-line endpoint
# bills MARKETS x REGIONS per call, and every group of 10 NAMED bookmakers counts as one region (the-odds-api.com
# quota docs; measured on the 2026-09-06 ev-scan Action runs: 500 -> 491 -> 474 with the old us,us2,eu default
# = 9 a pull). alerts.py pulls h2h + spreads + totals for --books core (odds.CORE_BOOKS: 10 books incl. Pinnacle,
# the sharp anchor), so every scheduled run below is 3 credits and has to earn it:
#   Sunday    hourly 13:00-21:00 UTC   (9am-5pm ET: inactives, the 1pm and 4pm kicks)      9 runs
#   Sunday    00:00 UTC Monday         (8pm ET: SNF pregame)                                1 run
#   Thursday  23:00 UTC                (7pm ET: TNF pregame)                                1 run
#   Monday    23:00 UTC                (7pm ET: MNF pregame)                                1 run
#   Tue-Sat   16:00 UTC                (noon ET: openers, mid-week moves; keeps the board fresh daily)  5 runs
#                                           = 17 runs/week x 3 credits = 51/week, ~220 credits/month
# (274 credits were left on 2026-09-09 after a first weekend of 9-credit dashboard pulls; this fits, with room
# for a few manual props scans. Add TNF/MNF kickoff lines or a second Sunday-evening run when the budget allows.)
# The dashboard's own live pulls (owner PIN, 'Pull fresh odds now') bill the same 3 and count toward
# MAX_CREDITS_PER_DAY; viewers read the snapshot and never pull. To pause, comment out the `schedule:` block; to
# spend less, delete cron lines (Sunday is the one that matters). `books` = wide adds Hard Rock / BetUS / LowVig /
# MyBookie / betPARX / Bally / Fliff ... at 6 credits a run -- halve the schedule.
# Every scheduled run pulls (it publishes the board even before a DISCORD_WEBHOOK exists); alerts go out only to
# the channels whose secrets are set.
# GitHub cron is UTC only and a window that crosses midnight is split into two lines, because the day of the
# week changes at 00:00 UTC: Sunday 8pm ET is "0 0 * * 1" (Monday in UTC), never "0 13-23,0 * * 0".
# The ET times above assume daylight time (UTC-4); after the November clock change everything lands an hour
# earlier on the wall clock (8am-4pm ET on Sunday, 7pm for SNF), which still covers the 1pm / 4pm / SNF windows.
name: alerts

on:
  workflow_dispatch:
    inputs:
      league:
        description: "nfl or cfb"
        default: "nfl"
      test:
        description: "true = send the current top pick regardless of what was already alerted (checks the webhook wiring)"
        type: choice
        options: ["false", "true"]
        default: "false"
      min_ev:
        description: "min EV % for a +EV pick to be alerted"
        default: "2.0"
      hours:
        description: "only games kicking off within this many hours (240 = a Tue-Mon slate)"
        default: "240"
      books:
        description: "core (10 books incl. Pinnacle = 3 credits), wide (20 = 6), or a comma list of Odds API book keys"
        default: "core"
  schedule:
    - cron: "0 13-21 * * 0"      # Sunday 13:00-21:00 UTC (9am-5pm ET): inactives, 1pm and 4pm kicks
    - cron: "0 0 * * 1"          # Sunday 8pm ET = Monday 00:00 UTC (SNF pregame)
    - cron: "0 23 * * 4"         # Thursday 23:00 UTC (7pm ET, TNF pregame)
    - cron: "0 23 * * 1"         # Monday 23:00 UTC (7pm ET, MNF pregame)
    - cron: "0 16 * * 2-6"       # Tuesday-Saturday 16:00 UTC (noon ET): openers, mid-week moves, a fresh board daily

# a manual "Run workflow" that lands on top of a scheduled run queues behind it instead of both restoring the same
# state and sending the same message twice (and two runs never race for the `board` branch)
concurrency:
  group: alerts
  cancel-in-progress: false

permissions:
  contents: write            # the board snapshot + line history are pushed to the `board` branch (never main)

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # the dedupe state from the previous run: the exact key never exists (new run id), so the prefix picks
      # the most recent save; no cache yet = first run = everything on the board is new
      - uses: actions/cache/restore@v4
        with:
          path: alerts_state.json
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-
      # what the previous run left on the `board` branch: its snapshot (--prev: the steam block is this pull vs
      # that one) and the line history so far (so today's parquet is appended to, not started over). Neither
      # exists before the first publish, and nothing here may fail the run: no prev = no steam block.
      - name: fetch the previous snapshot and the line history from the `board` branch
        env:
          LEAGUE: ${{ inputs.league || 'nfl' }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/djscott03/Scott-Sports-Predictions/board/board/odds_${LEAGUE}.csv" \
            -o prev_board.csv || rm -f prev_board.csv
          # the branch exists but cannot be fetched -> FAIL here, before the pull (0 credits): publishing without the
          # history would overwrite today's parquet with this run's single pull
          if git ls-remote --exit-code -q origin board >/dev/null 2>&1; then
            git fetch -q --depth=1 origin board:board
            if git cat-file -e board:history 2>/dev/null; then git archive board history | tar -x; fi
          fi
      # inputs are free text: passed through env vars, quoted, never interpolated into the shell; on a scheduled
      # run the inputs context is empty and the `||` defaults apply. Every run pulls once (3 credits), writes the
      # board snapshot to board/, appends the pull to history/, and alerts whichever channels have secrets.
      - name: pull the board, publish snapshot, alert (3 markets x 10 books = 3 credits with books=core)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LEAGUE: ${{ inputs.league || 'nfl' }}
          MIN_EV: ${{ inputs.min_ev || '2.0' }}
          HOURS: ${{ inputs.hours || '240' }}
          BOOKS: ${{ inputs.books || 'core' }}
          TEST: ${{ inputs.test || 'false' }}
        run: |
          PREV=""
          if [ -s prev_board.csv ]; then PREV="--prev prev_board.csv"; fi
          if [ "$TEST" = "true" ]; then
            python alerts.py "$LEAGUE" --min-ev "$MIN_EV" --hours "$HOURS" --books "$BOOKS" --snapshot board --history history --test
          else
            python alerts.py "$LEAGUE" --min-ev "$MIN_EV" --hours "$HOURS" --books "$BOOKS" --snapshot board --history history $PREV
          fi
      # the dashboard's snapshot + the line history, committed to the `board` branch (never main, so Streamlit
      # Cloud does not redeploy; no force: the branch keeps its history and grows by one small parquet a day;
      # --depth=1 so the runner never downloads that history). The first ever run creates the branch (orphan).
      # The app reads board/ from raw.githubusercontent.com.
      - name: publish the board snapshot and line history to the `board` branch
        if: always() && hashFiles('board/*.csv') != ''
        run: |
          git config user.name "sharpmodel-bot"
          git config user.email "actions@users.noreply.github.com"
          tmp="$(mktemp -d)"
          cp -r board "$tmp/board"
          if [ -d history ]; then cp -r history "$tmp/history"; fi
          rm -rf board history
          if git fetch -q --depth=1 origin board:board 2>/dev/null || git rev-parse -q --verify board >/dev/null; then
            git checkout -q board
          else
            git checkout -q --orphan board
            git rm -rfq . >/dev/null 2>&1 || true
          fi
          mkdir -p board && cp -r "$tmp/board/." board/ && git add -A board     # overlay: a cfb run keeps odds_nfl.csv
          if [ -d "$tmp/history" ]; then mkdir -p history && cp -r "$tmp/history/." history/ && git add -A history; fi
          if git diff --cached --quiet; then
            echo "board unchanged, nothing to publish"
          else
            git commit -qm "board snapshot $(date -u +%FT%TZ)"
          fi
          git push -q origin HEAD:board
      # save the state even when the scan failed (the restored file is re-saved unchanged); a --test run or a
      # first run that crashed before writing leaves no file, so save an empty one rather than fail the step
      - name: keep the dedupe state
        if: always()
        run: '[ -f alerts_state.json ] || echo "{}" > alerts_state.json'
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: alerts_state.json
          key: alerts-state-${{ github.run_id }}
      - name: job summary
        if: always()
        run: |
          if [ -f alerts_summary.md ]; then cat alerts_summary.md >> "$GITHUB_STEP_SUMMARY"; fi
